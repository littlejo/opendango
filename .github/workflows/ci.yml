name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Called by release.yml, so a release is only built from a commit that
  # passed the same gates.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test (defaults to the triggering commit)
        required: false
        type: string
        default: ''

concurrency:
  # inputs.ref keeps a release-triggered run out of the push/PR group.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@v7
        with:
          # Same version as mise.toml.
          go-version: '1.27.3'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Test
        run: go test ./...

      # ubuntu-latest ships the C toolchain -race requires.
      - name: Test (race)
        run: go test -race -count=1 ./...

      # The end-to-end build needs a real Xen Orchestra reachable from the
      # runner, which GitHub-hosted runners are not: without the XOA_* and
      # OPENDANGO_TEST_* variables the test skips. This step still checks
      # that the integration code compiles and skips cleanly.
      - name: Test (integration, skipped when not configured)
        run: go test -tags integration -count=1 ./...

      - name: Validate and check the format of the examples
        run: |
          for f in examples/*/Dangofile; do
            go run ./cmd/opendango validate -f "$f"
            go run ./cmd/opendango fmt --check -f "$f"
          done

      - name: Build
        run: go build -o dist/opendango ./cmd/opendango

      # Catches a broken .goreleaser.yaml before a tag is pushed.
      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  # plugin://qemu end to end, on the runner's KVM: a stage starts from the
  # disk of another (the images cache), FETCH brings files back.
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@v7
        with:
          # Same version as mise.toml.
          go-version: '1.27.3'
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      - name: Install the qemu plugin
        run: go run ./cmd/opendango plugin pull qemu

      - name: Cache the Debian image
        id: image
        uses: actions/cache@v4
        with:
          path: ~/debian-12-genericcloud-amd64.qcow2
          key: debian-12-genericcloud-amd64

      - name: Download the Debian image
        if: steps.image.outputs.cache-hit != 'true'
        run: curl -fsSL -o ~/debian-12-genericcloud-amd64.qcow2 https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2

      - name: Test (qemu end to end)
        env:
          OPENDANGO_TEST_QEMU_IMAGE: /home/runner/debian-12-genericcloud-amd64.qcow2
        run: go test -tags integration -count=1 -timeout 45m -v -run TestQemuEndToEnd ./builders/packer/
